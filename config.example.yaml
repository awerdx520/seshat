# seshat 服务示例配置
#
# 复制为 config.yaml 后按需修改。所有路径均相对于服务进程的工作目录。
# 敏感值（数据库密钥、API 令牌、LLM API key）禁止写入本文件或任何落盘文件，
# 只能通过环境变量注入，详见 docs/configuration.md。

server:
  # HTTP 监听地址。
  addr: ":8080"
  # 读超时，Go duration 字符串（如 30s、1m30s）。
  read_timeout: 30s
  # 写超时。
  write_timeout: 30s

db:
  # SQLite 数据库文件路径。
  path: "./data/seshat.db"
  # 数据库密钥：敏感，从环境变量 SESHAT_DB_KEY 读取，不在此处配置。

webdav:
  # 笔记根目录。
  root: "./data/seshat"
  # 对外公开的出口目录（WebDAV 公开范围）。
  public: "./data/seshat/public"
  # 对外出口是否只读：true 时对外出口拒绝一切写操作，默认 false（可读写）。
  public_read_only: false
  # 对外出口允许写入的文件扩展名白名单，例如：
  #   public_allow_exts: [".org", ".md", ".pdf", ".epub"]
  # 留空表示不限制扩展名（读操作始终不受限制）。
  public_allow_exts: []

llm:
  # 本地 LLM 节点 URL，留空表示不启用本地节点。
  local_node_url: ""
  # 云端 LLM API key：敏感，从环境变量 SESHAT_LLM_API_KEY 读取，不在此处配置。

# API 访问令牌：敏感，从环境变量 SESHAT_AUTH_TOKEN 读取，不在此处配置。
# LLM 节点令牌：敏感，从环境变量 SESHAT_NODE_TOKEN 读取，仅保护节点端点（未配置则回退主令牌）。
